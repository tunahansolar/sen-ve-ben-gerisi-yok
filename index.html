<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadece Sen ve Ben</title>
    <style>
        :root { 
            --pink-main: #ff7495; 
            --pink-light: #ffb7c5; 
            --pink-bg: #fff0f3; 
        } 
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
        } 
        body { 
            background-color: var(--pink-bg); 
            overflow-x: hidden; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        } 
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(255, 116, 149, 0.2); 
            text-align: center; 
            max-width: 90%; 
            width: 400px; 
            position: relative; 
            z-index: 10; 
        } 
        h2 { 
            color: var(--pink-main); 
            margin-bottom: 15px; 
            font-size: 24px; 
        }
        .couple-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .timer-title {
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .counter {
            background: var(--pink-bg);
            color: var(--pink-main);
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .heart {
            color: var(--pink-main);
            font-size: 40px;
            animation: beat 0.8s infinite alternate;
            margin-top: 15px;
            display: inline-block;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sadece Sen ve Ben</h2>
        
        <!-- Fotoğrafınızın adını sevgilim.jpg yapıp GitHub'a yüklediğinizde burada görünecek -->
        <img src="sevgilim.jpg" alt="Biz" class="couple-img">

        <p>Hayatımın en güzel detayısın. Seninle geçen her an, geriye kalan her şeyden çok daha değerli.</p>
        
        <div class="timer-title">💖 İyi Ki Varsın:</div>
        <div id="sayac" class="counter">Hesaplanıyor...</div>

        <div class="heart">❤️</div>
    </div>

    <script>
        // Sizin özel tarihiniz: 11.02.2026 olarak ayarlandı
        const baslangicTarihi = new Date(2026, 1, 11, 0, 0, 0);

        function sayaciGuncelle() {
            const simdi = new Date();
            const fark = simdi - baslangicTarihi;

            if (fark < 0) {
                document.getElementById("sayac").innerHTML = "Gelecekteki bir tarih seçildi!";
                return;
            }

            const toplamSaniye = Math.floor(fark / 1000);
            const toplamDakika = Math.floor(toplamSaniye / 60);
            const toplamSaat = Math.floor(toplamDakika / 60);
            
            const gun = Math.floor(toplamSaat / 24);
            const saat = toplamSaat % 24;
            const dakika = toplamDakika % 60;
            const saniye = toplamSaniye % 60;

            document.getElementById("sayac").innerHTML = 
                `${gun} Gün, ${saat} Saat, ${dakika} Dakika, ${saniye} Saniye`;
        }

        setInterval(sayaciGuncelle, 1000);
        sayaciGuncelle();
    </script>

</body>
</html>
